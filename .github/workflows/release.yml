# タグ v*.*.* を push すると exe をビルドして GitHub Release を作成します
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v4

      - name: Python の準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: タグと version.py の一致を確認
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = python -c "from version import __version__; print(__version__)"
          if ($tag.Substring(1) -ne $ver) {
            Write-Error "タグ $tag と version.py の $ver が一致しません"
            exit 1
          }

      - name: exe のビルド
        run: pyinstaller --clean --noconfirm sort_excel.spec

      - name: SHA256 の計算
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/sort_excel.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  sort_excel.exe" | Out-File dist/sort_excel.exe.sha256 -Encoding ascii -NoNewline
          Get-Content dist/sort_excel.exe.sha256

      - name: Release の作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/sort_excel.exe `
            dist/sort_excel.exe.sha256 `
            --title "${{ github.ref_name }}" `
            --generate-notes
